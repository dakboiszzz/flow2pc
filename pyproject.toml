[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flow2pc"
version = "0.1.0"
description = "Distill a flow-matching model into a time-indexed probabilistic circuit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.6",
  "torchvision>=0.21",
]

[project.optional-dependencies]
dev = ["ruff>=0.11"]

[tool.setuptools.packages.find]
include = ["repc*"]

[tool.ruff]
line-length = 88
target-version = "py311"
