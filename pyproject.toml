[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flow2pc"
version = "0.1.0"
description = "Distill a flow-matching model into a time-indexed probabilistic circuit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "networkx>=3.2",
  "scipy>=1.15",
  "torch>=2.6",
  "torchcfm==1.0.7",
  "torchdiffeq>=0.2.5",
  "torchvision>=0.21",
  "wandb>=0.25,<0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]
single-cell = ["h5py>=3.10", "POT>=0.9"]
alicfm = ["h5py>=3.10", "POT>=0.9", "pandas>=2.2", "scikit-learn>=1.5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["flow2pc*", "repc*"]

[tool.setuptools.package-data]
"flow2pc.pretrain.models.alicfm" = ["NOTICE.md", "SOURCE_PROVENANCE.json"]

[tool.ruff]
line-length = 88
target-version = "py311"

# Preserve upstream scientific source verbatim apart from documented plumbing.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/flow2pc/pretrain/models/alicfm/_source/*.py" = ["ALL"]
