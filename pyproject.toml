[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flow2pc"
version = "0.1.0"
description = "Distill a flow-matching model into a time-indexed probabilistic circuit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "networkx>=3.2",
  "pyjuice==2.2.0",
  "scipy>=1.15",
  "torch>=2.6",
  "torchcfm==1.0.7",
  "torchdiffeq>=0.2.5",
  "torchvision>=0.21",
  "wandb>=0.25,<0.30",
]

[project.optional-dependencies]
dev = ["ruff>=0.11"]

[tool.setuptools.packages.find]
include = ["repc*"]

[tool.ruff]
line-length = 88
target-version = "py311"
