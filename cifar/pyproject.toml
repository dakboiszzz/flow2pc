[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recompile-probabilistic"
version = "0.1.0"
description = "Recompiling pretrained flow-matching models into tractable probabilistic circuits"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.6",
  "torchvision>=0.21",
  "lightning>=2.6",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "wandb>=0.25",
  "numpy",
  "matplotlib",
]

[project.optional-dependencies]
pretrained = ["diffusers>=0.37"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["repc*"]
