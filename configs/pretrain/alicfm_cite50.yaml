# Migrated ALI-CFM single-fold trainer. This command starts training when run.
# Network/objective settings come from ../ali-cfm/configs/single_cell/50D/cite-50D.yaml.
# The shared loader now splits first and fits scaling on observed TRAIN cells.
# This differs from the old all-day scaler and is not paper-score reproduction.
stage: pretrain
seed: 42
model:
  name: alicfm
  params:
    cfm_dim: 1024
    interpolant_dim: 1024
    disc_dim: 1024
    t_smooth: 0.01
    pretain_ot: mmot
    interpolant_ot: mmot
    cfm_ot: mmot
    correct_coeff: 0.00000005
    reg_metric: land
    land_gamma: 0.00000002
    land_t_gamma: 0.00000002
    land_epsilon: 0.000001
    reg_term_type: 2nd_derivative
    num_t_steps: 3
    finite_difference_h: 0.001
    gan_loss: R3GAN
    r3gan_gamma: 1.0
data:
  name: cite
  root: /data/lthung/ali-cfm-data
  params:
    dim: 50
    heldout_index: 1
    validation_fraction: 0.05
    test_fraction: 0.05
    normalise: true
    whiten: false
training:
  device: cuda:0
  batch_size: 128
  num_ali_pretrain_steps: 2000
  pretrain_lr: 0.001
  num_ali_train_steps: 70000
  interpolant_gen_lr: 0.00005
  interpolant_disc_lr: 0.00005
  num_cfm_train_steps: 2001
  cfm_lr: 0.001
logging:
  mode: online
  project: flow2pc
  name: alicfm-cite50-fold1-seed42
output:
  dir: /data/lthung/flow2pc/framework/pretrain/alicfm/cite50/fold1-seed42
