# Native teacher training protocol: all observed rows; all-time sequential preprocessing.
# Student row splits remain separate; post-training figures use the explicit evaluation protocol.
stage: pretrain
seed: 42
model:
  name: alicfm
  params:
    cfm_dim: 64
    interpolant_dim: 64
    disc_dim: 64
    t_smooth: 0.01
    pretain_ot: mmot
    interpolant_ot: mmot
    cfm_ot: mmot
    correct_coeff: 1.0e-07
    reg_metric: land
    land_gamma: 2.0e-06
    land_t_gamma: 2.0e-06
    land_epsilon: 1.0e-06
    reg_term_type: 2nd_derivative
    num_t_steps: 3
    finite_difference_h: 0.001
    gan_loss: R3GAN
    r3gan_gamma: 1.0
    profile: single_cell
data:
  name: multi
  root: /data/lthung/ali-cfm-data
  params:
    dim: 5
    heldout_index: 1
    validation_fraction: 0.05
    test_fraction: 0.05
    normalise: true
    whiten: true
    preprocessing_protocol: native_all
training:
  device: cuda:0
  batch_size: 128
  num_ali_pretrain_steps: 2000
  pretrain_lr: 0.001
  num_ali_train_steps: 70000
  interpolant_gen_lr: 5.0e-05
  interpolant_disc_lr: 5.0e-05
  num_cfm_train_steps: 2001
  cfm_lr: 0.001
  protocol: native
logging:
  mode: online
  project: flow2pc
  name: alicfm-multi5-native-fold1-seed42
output:
  dir: /data/lthung/flow2pc/framework/pretrain/alicfm/multi5/fold1-seed42
evaluation:
  enabled: true
  num_samples: 2048
  metric_samples: 2048
  batch_size: 64
  seed: 2026
  solver: dopri5
  tolerance: 1.0e-05
  ode_steps: 100
  max_nfe: 50000
  metric_space: historical
  source_split: all
  reference_split: all
