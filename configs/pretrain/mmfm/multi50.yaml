stage: pretrain
seed: 42
model:
  name: mmfm
  params:
    source_root: ../pretrain/MMFM
    conditional_model: false
    coupling: minibatch_ot
    interpolation: cubic
    flow_variance: adaptive2-4-0.01
data:
  name: mfm_snapshots
  root: data/mfm/prepared/multi50/seed42
  params:
    profile: multi50
training:
  epochs: 300
  batch_size: 128
  lr: 0.01
  device: auto
output:
  dir: outputs/mmfm/multi50/pretrain
evaluation:
  enabled: true
wandb:
  mode: disabled
