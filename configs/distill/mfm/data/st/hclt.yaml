# Frozen paired MFM teacher; velocity MSE only; empirical source initialization.
stage: distill
seed: 42
teacher:
  name: mfm
  checkpoint: outputs/mfm/st/default/pretrain/checkpoints/flow.pt
  params:
    geopath_checkpoint: outputs/mfm/st/default/pretrain/checkpoints/geopath.pt
data:
  name: mfm_snapshots
  root: data/mfm/prepared/st/seed42
student:
  name: hclt
  params:
    num_latents: 64
    time_embedding_dim: 64
    topology: learned
    topology_samples: 2048
    time_order: 4
distillation:
  validation_scope: dataset
  validation_population_metrics: true
  steps: 20000
  batch_size: 128
  lr: 0.001
  device: auto
  gradient_clip: 1.0
  log_every: 100
  validate_every: 1000
  checkpoint_every: 5000
  resume_checkpoint: null
output:
  dir: outputs/mfm/st/default/distill/hclt
evaluation:
  metric_space: dataset
  solver: dopri5
  samples: 2048
  seed: 2026
  enabled: true
wandb:
  project: flow2pc
  mode: online
