stage: distill
teacher:
  name: mfm
  checkpoint: checkpoints/metric_flow/cite/hbi8lc32/flow_model/epoch=509-step=24990.ckpt
  params:
    repo_path: /data/pqhung_group/pdtung/metric-flow-matching
    geopath_checkpoint: checkpoints/metric_flow/cite/hbi8lc32/geopath_model/epoch=15-step=784.ckpt
data:
  name: cite
  root: /data/pqhung_group/pdtung/metric-flow-matching/data
student:
  name: hclt
  params:
    num_latents: 64
    time_embedding_dim: 64
    topology: learned
    topology_samples: 2048
    time_order: 4
distillation:
  validation_scope: dataset
  validation_population_metrics: true
  steps: 20000
  batch_size: 128
  lr: 0.001
  device: auto
  gradient_clip: 1.0
  log_every: 100
  validate_every: 1000
  checkpoint_every: 5000
  resume_checkpoint: null
seed: 42
output:
  dir: outputs/runs/metric/cite_hclt
evaluation:
  metric_space: dataset
  solver: dopri5
  samples: 2048
  seed: 2026
  enabled: true
  projections: 32
  ode_substeps: 16
  decode_images: false
  vae_path: checkpoints/metric_flow/vae
wandb:
  project: flow2pc
  mode: online
