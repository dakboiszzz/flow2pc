# Student objective: frozen teacher velocity MSE only.
stage: distill
seed: 0
teacher:
  checkpoint: /data/lthung/flow2pc/framework/pretrain/alicfm/multi100/fold1-seed42/checkpoints/last.pt
student:
  name: hclt
  params:
    num_latents: 128
    time_embedding_dim: 32
    time_feature_seed: 0
distillation:
  sampler:
    name: teacher_interpolant
    params: {}
  device: cuda:0
  steps: 20000
  batch_size: 64
  lr: 0.001
  validate_every: 1000
  checkpoint_every: 1000
  log_every: 100
  validation_batches: 4
  validation_batch_size: 128
  resume: true
logging:
  mode: online
  project: flow2pc
  name: multi100-hclt-h128-f32-lr0.001-b64-seed0
output:
  dir: /data/lthung/flow2pc/framework/distill/alicfm/multi100/hclt-h128-f32-lr0.001-b64-seed0

# Post-training ODE evaluation and images; never contributes to the student loss.
evaluation:
  enabled: true
  num_samples: 2048
  metric_samples: 2048
  batch_size: 64
  seed: 2026
  solver: dopri5
  tolerance: 1.0e-05
  ode_steps: 100
  max_nfe: 50000
  metric_space: historical
  source_split: all
  reference_split: all
